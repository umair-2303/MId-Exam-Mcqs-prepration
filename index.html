<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculus III midterm practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F2E9;--ink:#242424;--mute:#6b6a60;--line:#dcd7c6;--accent:#80845A;--atext:#5f6340;--good:#80845A;--wrong:#242424;--tint:#ebe8d8;
--serif:"Literata",Georgia,"Times New Roman",serif;--sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#242424;--ink:#F5F2E9;--mute:#a39f90;--line:#3b3b37;--accent:#80845A;--atext:#a9ad82;--good:#80845A;--wrong:#F5F2E9;--tint:#2f3027;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#242424;--ink:#F5F2E9;--mute:#a39f90;--line:#3b3b37;--accent:#80845A;--atext:#a9ad82;--good:#80845A;--wrong:#F5F2E9;--tint:#2f3027;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;transition:background-color .3s ease,color .3s ease}
main{max-width:640px;margin:0 auto;padding:40px 24px 72px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
h1{font:500 44px/1.1 var(--serif);margin:0 0 8px;letter-spacing:-.01em}
.sub{margin:0 0 40px;color:var(--mute);font-size:17px}
.sec{font:600 15px/1.3 var(--sans);margin:0}
.count{color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums}
.bar{height:2px;background:var(--line);margin:14px 0 20px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s ease}
.tools{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--mute);margin-bottom:44px}
select,button{font:inherit;color:inherit}
select{background:transparent;border:0;border-bottom:1px solid var(--line);padding:2px 18px 2px 0;border-radius:0;color:var(--ink)}
label{display:flex;gap:6px;align-items:center;cursor:pointer}
input[type=checkbox]{accent-color:var(--accent)}
.link{background:none;border:0;padding:0;cursor:pointer;color:var(--mute);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.link:hover{color:var(--ink)}
.topic{font:600 19px/1.3 var(--sans);color:var(--atext);margin:0 0 12px}
.q{font:400 24px/1.4 var(--serif);margin:0 0 28px;overflow-wrap:anywhere}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li{margin:0}
.opt{display:flex;gap:14px;width:100%;text-align:left;background:var(--tint);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;font:400 18px/1.45 var(--serif);align-items:center}
.opt b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;flex:none;font:600 14px var(--sans);background:var(--bg);color:var(--atext);border:1.5px solid var(--line);transition:background-color .2s ease,color .2s ease,border-color .2s ease}
.opt{transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .15s ease}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:hover:not(:disabled) b{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.opt:active:not(:disabled){transform:scale(.985)}
.opt:disabled{cursor:default;color:var(--ink)}
li:not(.ok):not(.no) .opt:disabled{opacity:.55}
li.ok .opt{background:var(--good);border-color:var(--good);color:#242424;animation:mark .4s ease}
li.ok b{background:#F5F2E9;color:#5f6340;border-color:#F5F2E9}
li.no .opt{background:var(--ink);border-color:var(--ink);color:var(--bg);animation:mark .4s ease,nudge .35s ease}
li.no b{background:var(--bg);color:var(--ink);border-color:var(--bg)}
li.no .opt span{text-decoration:line-through;text-decoration-color:currentColor;opacity:.85}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.verdict{min-height:28px;margin:18px 0 0;font-size:15px}
.verdict.ok,.verdict.no{animation:fade .4s ease .1s both}
.verdict.ok{color:var(--atext)}.verdict.no{color:var(--wrong)}
nav{display:flex;justify-content:space-between;margin-top:28px}
.btn{background:none;border:1px solid var(--line);padding:9px 20px;cursor:pointer;border-radius:2px;transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .15s ease,opacity .2s ease}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn:disabled{opacity:.35;cursor:default}
.btn.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.done{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.done h2{font:400 32px/1.2 var(--serif);margin:24px 0 8px}
.done p{color:var(--mute);margin:0 0 24px}
@media (max-width:480px){h1{font-size:36px}main{padding:28px 18px 56px}.q{font-size:21px}.opt{font-size:17px}}
[hidden]{display:none!important}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;padding:5px 14px;cursor:pointer;color:var(--mute);transition:background-color .2s ease,color .2s ease}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--bg)}
li.sel .opt{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
li.sel b{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.rev{margin-top:40px}.rev .sec{margin-bottom:12px}
.ri{border-top:1px solid var(--line);padding:16px 0}
.ri p{font:400 17px/1.45 var(--serif);margin:0 0 8px}
.ri small{color:var(--mute);font-size:14px;line-height:1.6}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes mark{from{transform:scale(.97)}}
@keyframes nudge{0%,100%{transform:none}25%{transform:translateX(-5px)}60%{transform:translateX(4px)}}
h1,.sub,header,.tools{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.sub{animation-delay:.06s}header{animation-delay:.12s}.tools{animation-delay:.18s}
.enter .topic,.enter .q{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
.enter .q{animation-delay:.05s}
.enter li{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
.enter li:nth-child(1){animation-delay:.1s}.enter li:nth-child(2){animation-delay:.15s}.enter li:nth-child(3){animation-delay:.2s}.enter li:nth-child(4){animation-delay:.25s}.enter li:nth-child(5){animation-delay:.3s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<h1>Calculus III</h1>
<p class="sub">Midterm multiple-choice practice</p>
<header><h2 class="sec">Questions</h2><span class="count" id="count"></span></header>
<div class="bar"><i id="fill"></i></div>
<div class="tools">
<div class="seg" id="modes"><button data-m="practice">Practice</button><button data-m="quiz">Quiz</button></div>
<div class="seg" id="sizes" hidden><button data-m="x" data-n="20">20</button><button data-m="x" data-n="30">30</button><button data-m="x" data-n="50">50</button></div>
<select id="topic" aria-label="Topic"></select>
<label id="shufwrap"><input type="checkbox" id="shuf"> Shuffle</label>
<button class="link" id="reset">Clear answers</button>
<button class="link" id="theme" aria-label="Switch theme"></button>
</div>
<section id="view" aria-live="polite"></section>
</main>
<script>
const Q=[{"q":"The domain of f(x, y) = y - x is:","o":[["A","y ≥ x"],["B","x + y > 0"],["C","All points (x, y) in R²"],["D","x > 0"],["E","x < 0"]],"a":"C"},{"q":"The range of f(x, y) = y - x is:","o":[["A","[0,∞)"],["B","All real numbers"],["C","(0,∞)"],["D","(-∞,0]"],["E","[0,1]"]],"a":"B"},{"q":"The domain of f(x, y) = √(y - x) is:","o":[["A","y ≤ x"],["B","y ≥ x"],["C","y ≥ 0"],["D","All of R²"],["E","x < 0"]],"a":"B"},{"q":"The range of f(x, y) = √(y - x) is:","o":[["A","All real numbers"],["B","(-∞,0]"],["C","[0,∞)"],["D","(0,∞)"],["E","[0,1]"]],"a":"C"},{"q":"The domain of f(x, y) = 4x² + 9y² is:","o":[["A","x ≥ 0 and y ≥ 0"],["B","All of R²"],["C","All (x, y) except (0, 0)"],["D","x² + y² ≤ 1"],["E","y ≥ 0"]],"a":"B"},{"q":"The range of f(x, y) = 4x² + 9y² is:","o":[["A","(0,∞)"],["B","All real numbers"],["C","(-∞,0]"],["D","[0,∞)"],["E","[0,1]"]],"a":"D"},{"q":"The domain of f(x, y) = x² - y² is:","o":[["A","x² ≥ y²"],["B","x ≥ y"],["C","All of R²"],["D","x ≠ y"],["E","y ≥ 0"]],"a":"C"},{"q":"The range of f(x, y) = x² - y² is:","o":[["A","[0,∞)"],["B","(-∞,0]"],["C","(0,∞)"],["D","All real numbers"],["E","[0,1]"]],"a":"D"},{"q":"The domain of f(x, y) = xy is:","o":[["A","All of R²"],["B","xy ≥ 0"],["C","x ≠ 0 and y ≠ 0"],["D","x > 0 and y > 0"],["E","y ≥ 0"]],"a":"A"},{"q":"The range of f(x, y) = xy is:","o":[["A","[0,∞)"],["B","All real numbers"],["C","(0,∞)"],["D","(-∞,0]"],["E","[-1,1]"]],"a":"B"},{"q":"The domain of f(x, y) = y/x² is:","o":[["A","y ≠ 0"],["B","All of R²"],["C","x ≠ 0"],["D","x > 0"],["E","y ≥ 0"]],"a":"C"},{"q":"The range of f(x, y) = y/x² is:","o":[["A","[0,∞)"],["B","(0,∞)"],["C","(-∞,0]"],["D","All real numbers"],["E","[-1,1]"]],"a":"D"},{"q":"The domain of f(x, y) = 1/√(16 - x² - y²) is:","o":[["A","x² + y² ≤ 16"],["B","x² + y² > 16"],["C","x² + y² ≥ 16"],["D","x² + y² < 16"],["E","y ≥ 0"]],"a":"D"},{"q":"The range of f(x, y) = 1/√(16 - x² - y²) is:","o":[["A","(0,1/4]"],["B","[1/4,∞)"],["C","(0,∞)"],["D","[4,∞)"],["E","[-1,1]"]],"a":"B"},{"q":"The domain of f(x, y) = √(9 - x² - y²) is:","o":[["A","x² + y² ≥ 9"],["B","x² + y² < 9"],["C","x² + y² ≤ 9"],["D","All of R²"],["E","y ≥ 0"]],"a":"C"},{"q":"The range of f(x, y) = √(9 - x² - y²) is:","o":[["A","[0,9]"],["B","[-3,3]"],["C","[0,∞)"],["D","[0,3]"],["E","[-1,1]"]],"a":"D"},{"q":"The domain of f(x, y) = ln(x² + y²) is:","o":[["A","All of R²"],["B","All (x, y) except (0, 0)"],["C","x² + y² > 1"],["D","x > 0 and y > 0"],["E","y ≥ 0"]],"a":"B"},{"q":"The range of f(x, y) = ln(x² + y²) is:","o":[["A","(0,∞)"],["B","[0,∞)"],["C","All real numbers"],["D","(-∞,0)"],["E","[-1,1]"]],"a":"C"},{"q":"The domain of f(x, y) = e^-(x²+y²) is:","o":[["A","x² + y² ≤ 1"],["B","x > 0 and y > 0"],["C","All (x, y) except (0, 0)"],["D","All of R²"],["E","y ≥ 0"]],"a":"D"},{"q":"The range of f(x, y) = e^-(x²+y²) is:","o":[["A","[0,1]"],["B","(0,1]"],["C","(0,∞)"],["D","[1,∞)"],["E","[-1,1]"]],"a":"B"},{"q":"The domain of f(x, y) = sin⁻¹(y - x) is:","o":[["A","-1 ≤ y - x ≤ 1"],["B","y - x ≥ 0"],["C","-π/2 ≤ y - x ≤ π/2"],["D","All of R²"],["E","y ≥ 0"]],"a":"A"},{"q":"The range of f(x, y) = sin⁻¹(y - x) is:","o":[["A","[-1,1]"],["B","(-π/2,π/2)"],["C","[-π/2,π/2]"],["D","[0,π]"],["E","[-1,1]"]],"a":"C"},{"q":"The domain of f(x, y) = tan⁻¹(y/x) is:","o":[["A","All of R²"],["B","y ≠ 0"],["C","x > 0"],["D","x ≠ 0"],["E","y ≥ 0"]],"a":"D"},{"q":"The range of f(x, y) = tan⁻¹(y/x) is:","o":[["A","[-π/2,π/2]"],["B","(-π/2,π/2)"],["C","All real numbers"],["D","(0,π)"],["E","[-1,1]"]],"a":"B"},{"q":"Evaluate lim (x,y)→(0,0) (3x² - y² + 5)/(x² + y² + 2):","o":[["A","0"],["B","5/2"],["C","5"],["D","3/2"],["E","Does not exist"]],"a":"B"},{"q":"Evaluate lim (x,y)→(0,4) x/√y:","o":[["A","2"],["B","1/2"],["C","1"],["D","Does not exist"],["E","0"]],"a":"E"},{"q":"Evaluate lim (x,y)→(3,4) √(x² + y² - 1):","o":[["A","5"],["B","24"],["C","√26"],["D","2√6"],["E","7"]],"a":"D"},{"q":"Evaluate lim (x,y)→(2,-3) (1/x + 1/y)²:","o":[["A","1/6"],["B","-1/36"],["C","1/36"],["D","25/36"],["E", Q.forEach((q,i)=>{q.i=i;q.t=(T.find(t=>t[0].test(q.q))||[0,"Other"])[1]});
const KEY="calc3-mcq-v2";
let S={topic:"All",shuf:false,mode:"practice",n:20,order:[],pos:0,ans:{},qa:{}};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.order)S=Object.assign(S,s)}catch(e){}
const $=id=>document.getElementById(id);
const quiz=()=>S.mode==="quiz";
const A=()=>quiz()?S.qa:S.ans;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function build(){
 let o=Q.filter(q=>S.topic==="All"||q.t===S.topic).map(q=>q.i);
 if(S.shuf||quiz())for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]]}
 if(quiz())o=o.slice(0,S.n);
 S.order=o;S.pos=0;if(quiz())S.qa={};
}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function ot(i,k){const o=Q[i].o.find(x=>x[0]===k);return o?k+". "+o[1]:"No answer"}
function ui(){
 document.querySelectorAll("#modes button").forEach(b=>b.classList.toggle("on",b.dataset.m===S.mode));
 document.querySelectorAll("#sizes button").forEach(b=>b.classList.toggle("on",+b.dataset.n===S.n));
 $("sizes").hidden=!quiz();$("shufwrap").hidden=quiz();
}
function finish(n,done){
 const a0=A(),right=S.order.filter(i=>a0[i]===Q[i].a).length,qz=quiz();
 $("count").textContent=n+" / "+n;
 let h='<div class="done"><h2>'+right+' of '+n+' correct'+(qz?' ('+Math.round(right/n*100)+'%)':'')+'</h2><p>'+(done<n?(n-done)+' unanswered.':'All questions answered.')+'</p><button class="btn main" id="again">'+(qz?'New quiz':'Start again')+'</button> <button class="btn" id="back">Back to last question</button></div>';
 if(qz){
  const w=S.order.filter(i=>a0[i]!==Q[i].a);
  h+='<div class="rev"><h2 class="sec">'+(w.length?'Review: '+w.length+' to revisit':'Perfect score')+'</h2>'+w.map(i=>'<div class="ri"><p>'+esc(Q[i].q)+'</p><small>Your answer: '+esc(ot(i,a0[i]))+'<br>Correct answer: '+esc(ot(i,Q[i].a))+'</small></div>').join("")+'</div>';
 }
 $("view").innerHTML=h;
 $("again").onclick=()=>{if(!qz)S.ans={};build();save();render(true)};
 $("back").onclick=()=>{S.pos=n-1;save();render()};
}
function render(anim){
 const n=S.order.length,v=$("view"),a0=A(),qz=quiz();
 const done=S.order.filter(i=>a0[i]).length;
 $("fill").style.width=(n?done/n*100:0)+"%";
 if(!n){v.innerHTML='<p class="topic">No questions in this topic.</p>';$("count").textContent="";return}
 if(S.pos>=n){finish(n,done);return}
 const q=Q[S.order[S.pos]],a=a0[q.i];
 $("count").textContent=(qz?"Quiz ":"")+(S.pos+1)+" / "+n;
 v.innerHTML='<h2 class="topic">'+q.t+'</h2><h3 class="q">'+esc(q.q)+'</h3><ul>'+q.o.map(o=>{
  const c=qz?(a===o[0]?"sel":""):(a?(o[0]===q.a?"ok":(o[0]===a?"no":"")):"");
  return '<li class="'+c+'"><button class="opt" data-k="'+o[0]+'"'+(!qz&&a?" disabled":"")+'><b>'+o[0]+'</b><span>'+esc(o[1])+'</span></button></li>'}).join("")+'</ul>'+
  '<p class="verdict '+(!qz&&a?(a===q.a?"ok":"no"):"")+'">'+(!qz&&a?(a===q.a?"Correct.":"Not quite. The answer is "+q.a+"."):"")+'</p>'+
  '<nav><button class="btn" id="prev"'+(S.pos?"":" disabled")+'>Previous</button><button class="btn'+(a?" main":"")+'" id="next">'+(S.pos===n-1?"Finish":"Next")+'</button></nav>';
 if(anim){v.classList.remove("enter");void v.offsetWidth;v.classList.add("enter")}else v.classList.remove("enter");
 v.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(b.dataset.k));
 $("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);
}
function pick(k){const q=Q[S.order[S.pos]],a=A();if(!quiz()&&a[q.i])return;a[q.i]=k;save();render()}
function go(d){S.pos=Math.max(0,S.pos+d);save();render(true);window.scrollTo({top:0,behavior:"smooth"})}
const sel=$("topic");
["All",...[...new Set(Q.map(q=>q.t))]].forEach(t=>{const o=document.createElement("option");o.value=o.textContent=t;sel.appendChild(o)});
sel.value=S.topic;$("shuf").checked=S.shuf;
sel.onchange=()=>{S.topic=sel.value;build();save();render(true)};
$("shuf").onchange=e=>{S.shuf=e.target.checked;build();save();render(true)};
$("reset").onclick=()=>{if(!quiz())S.ans={};build();save();render(true)};
document.querySelectorAll("#modes button").forEach(b=>b.onclick=()=>{if(S.mode===b.dataset.m)return;S.mode=b.dataset.m;build();ui();save();render(true)});
document.querySelectorAll("#sizes button").forEach(b=>b.onclick=()=>{S.n=+b.dataset.n;build();ui();save();render(true)});
document.addEventListener("keydown",e=>{
 if(e.target.tagName==="SELECT"||e.metaKey||e.ctrlKey)return;
 const k=e.key.toUpperCase();
 if("ABCDE".includes(k)&&k.length===1&&S.pos<S.order.length)pick(k);
 else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);
});
if(!S.order.length||S.order.some(i=>!Q[i]))build();
let th=null;try{th=localStorage.getItem("calc3-theme")}catch(e){}
function isDark(){return th?th==="dark":matchMedia("(prefers-color-scheme:dark)").matches}
function applyTheme(){const r=document.documentElement;if(th)r.dataset.theme=th;else delete r.dataset.theme;$("theme").textContent=isDark()?"Light theme":"Dark theme"}
$("theme").onclick=()=>{th=isDark()?"light":"dark";try{localStorage.setItem("calc3-theme",th)}catch(e){}applyTheme()};
applyTheme();ui();
render(true);
</script>
</body>
</html>
